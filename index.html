<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.A Store - متجر الملابس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
            --light-color: #f8f9fa;
            --dark-color: #2c3e50;
            --gray-color: #95a5a6;
            --success-color: #27ae60;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* رأس الموقع */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-left: 10px;
            color: var(--secondary-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-icon {
            position: relative;
            font-size: 24px;
            cursor: pointer;
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--secondary-color);
            color: white;
            font-size: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .admin-link {
            background-color: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .admin-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* قسم المنتجات */
        .products-section {
            padding: 40px 0;
            flex-grow: 1;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            color: var(--primary-color);
            font-size: 32px;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 50%;
            transform: translateX(50%);
            width: 100px;
            height: 3px;
            background-color: var(--secondary-color);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-color);
            font-size: 18px;
        }

        .product-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .product-img {
            height: 220px;
            width: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .product-description {
            color: var(--gray-color);
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.5;
            height: 42px;
            overflow: hidden;
        }

        .product-price {
            color: var(--secondary-color);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .product-category {
            display: inline-block;
            background-color: #f1f2f6;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            background-color: #f1f2f6;
            border-radius: 5px;
            overflow: hidden;
        }

        .quantity-btn {
            background-color: #dfe4ea;
            border: none;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quantity-input {
            width: 50px;
            height: 35px;
            border: none;
            text-align: center;
            background-color: white;
            font-weight: 600;
        }

        .add-to-cart {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
        }

        .add-to-cart:hover {
            background-color: #2980b9;
        }

        .add-to-cart i {
            margin-left: 8px;
        }

        /* لوحة الإدارة */
        .admin-panel {
            background-color: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin: 20px 0;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 15px;
        }

        .admin-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .form-control {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #219653;
        }

        .btn-danger {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-secondary {
            background-color: var(--gray-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .admin-products-list {
            margin-top: 30px;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .products-table th,
        .products-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        .products-table th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        /* عربة التسوق */
        .cart-sidebar {
            position: fixed;
            top: 0;
            left: -400px;
            width: 380px;
            height: 100vh;
            background-color: white;
            box-shadow: var(--shadow);
            transition: var(--transition);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-sidebar.active {
            left: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .cart-title {
            font-size: 24px;
            color: var(--primary-color);
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray-color);
        }

        .cart-items {
            flex-grow: 1;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            margin-left: 15px;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: var(--secondary-color);
            font-weight: 700;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .cart-item-quantity button {
            background-color: #f1f2f6;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 3px;
            cursor: pointer;
        }

        .cart-item-quantity span {
            margin: 0 10px;
            font-weight: 600;
        }

        .remove-item {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 18px;
            margin-right: 10px;
        }

        .cart-footer {
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .cart-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkout-btn, .clear-cart-btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            font-size: 16px;
        }

        .checkout-btn {
            background-color: var(--success-color);
            color: white;
        }

        .checkout-btn:hover {
            background-color: #219653;
        }

        .clear-cart-btn {
            background-color: #f1f2f6;
            color: #333;
        }

        .clear-cart-btn:hover {
            background-color: #dfe4ea;
        }

        .overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* نافذة تسجيل الدخول */
        .login-modal {
            position: fixed;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            z-index: 1001;
            width: 90%;
            max-width: 400px;
            display: none;
        }

        .login-modal.active {
            display: block;
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: none;
            text-align: center;
        }

        .login-error.active {
            display: block;
        }

        /* نافذة تأكيد الطلب */
        .confirm-modal {
            position: fixed;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            z-index: 1001;
            width: 90%;
            max-width: 500px;
            display: none;
        }

        .confirm-modal.active {
            display: block;
        }

        .confirm-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-align: center;
        }

        .order-summary {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .confirm-btn, .cancel-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
        }

        .confirm-btn {
            background-color: var(--success-color);
            color: white;
        }

        .confirm-btn:hover {
            background-color: #219653;
        }

        .cancel-btn {
            background-color: #f1f2f6;
            color: #333;
        }

        .cancel-btn:hover {
            background-color: #dfe4ea;
        }

        /* رسائل التنبيه */
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            text-align: right;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-right: 4px solid var(--success-color);
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border-right: 4px solid var(--secondary-color);
        }

        .alert.show {
            display: block;
        }

        /* التذييل */
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 30px 0;
            text-align: center;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .whatsapp-contact {
            display: flex;
            align-items: center;
            background-color: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: var(--transition);
        }

        .whatsapp-contact:hover {
            background-color: #128C7E;
            transform: translateY(-3px);
        }

        .whatsapp-contact i {
            margin-left: 10px;
            font-size: 20px;
        }

        /* التكيف مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .cart-sidebar {
                width: 100%;
                left: -100%;
            }
            
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
            
            .admin-form {
                grid-template-columns: 1fr;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .products-table {
                display: block;
                overflow-x: auto;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .login-modal,
            .confirm-modal {
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- رأس الموقع -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">
                    <i class="fas fa-tshirt"></i>
                    D.A Store
                </a>
                <div class="header-actions">
                    <div class="cart-icon" id="cartIcon">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count" id="cartCount">0</span>
                    </div>
                    <button class="admin-link" id="toggleAdminPanel">
                        <i class="fas fa-user-shield"></i>
                        لوحة التحكم
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- قسم المنتجات -->
    <section class="products-section">
        <div class="container">
            <h2 class="section-title">منتجاتنا</h2>
            
            <!-- لوحة إدارة المسؤول -->
            <div class="admin-panel" id="adminPanel">
                <h2 class="admin-title">لوحة إدارة المنتجات</h2>
                <form class="admin-form" id="adminForm">
                    <input type="hidden" id="productId" value="">
                    
                    <div class="form-group">
                        <label for="productName">اسم المنتج *</label>
                        <input type="text" id="productName" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="productPrice">السعر (جنيه) *</label>
                        <input type="number" id="productPrice" class="form-control" min="0" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="productCategory">الفئة</label>
                        <select id="productCategory" class="form-control">
                            <option value="ملابس رجالية">ملابس رجالية</option>
                            <option value="ملابس نسائية">ملابس نسائية</option>
                            <option value="ملابس أطفال">ملابس أطفال</option>
                            <option value="إكسسوارات">إكسسوارات</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="productImage">رابط الصورة</label>
                        <input type="text" id="productImage" class="form-control" 
                               value="https://via.placeholder.com/400x300/2c3e50/ffffff?text=D.A+Store">
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="productDescription">الوصف</label>
                        <textarea id="productDescription" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-plus-circle"></i>
                            إضافة منتج
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">
                            <i class="fas fa-times"></i>
                            إلغاء التعديل
                        </button>
                        <button type="button" class="btn btn-danger" id="logoutBtn" style="display: none;">
                            <i class="fas fa-sign-out-alt"></i>
                            تسجيل الخروج
                        </button>
                    </div>
                </form>
                
                <div class="admin-products-list">
                    <h3 style="margin-bottom: 15px; color: var(--primary-color);">قائمة المنتجات</h3>
                    <div id="adminProductsList">
                        <!-- سيتم عرض المنتجات هنا -->
                    </div>
                </div>
            </div>
            
            <!-- قائمة المنتجات للزبائن -->
            <div class="products-grid" id="productsGrid">
                <!-- سيتم عرض المنتجات هنا -->
            </div>
        </div>
    </section>

    <!-- عربة التسوق -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3 class="cart-title">عربة التسوق</h3>
            <button class="close-cart" id="closeCart">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- سيتم إضافة عناصر العربة ديناميكيًا -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>الإجمالي:</span>
                <span id="cartTotal">0 جنيه</span>
            </div>
            <div class="cart-buttons">
                <button class="checkout-btn" id="checkoutBtn">تأكيد الطلب</button>
                <button class="clear-cart-btn" id="clearCartBtn">تفريغ العربة</button>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-modal" id="loginModal">
        <h3 class="login-title">تسجيل الدخول للإدارة</h3>
        <div class="login-error" id="loginError">
            اسم المستخدم أو كلمة المرور غير صحيحة
        </div>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="loginUsername">اسم المستخدم</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="asmaaali" required>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">كلمة المرور</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="123" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>
                <button type="button" class="btn btn-secondary" id="closeLogin">
                    <i class="fas fa-times"></i>
                    إلغاء
                </button>
            </div>
        </form>
    </div>

    <!-- نافذة تأكيد الطلب -->
    <div class="confirm-modal" id="confirmModal">
        <h3 class="confirm-title">تأكيد الطلب</h3>
        <div class="order-summary" id="orderSummary">
            <!-- سيتم ملء ملخص الطلب ديناميكيًا -->
        </div>
        <div class="modal-buttons">
            <button class="confirm-btn" id="sendWhatsAppBtn">إرسال عبر واتساب</button>
            <button class="cancel-btn" id="cancelOrderBtn">إلغاء</button>
        </div>
    </div>

    <!-- طبقة التعتيم -->
    <div class="overlay" id="overlay"></div>

    <!-- التذييل -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p>© 2023 D.A Store. جميع الحقوق محفوظة.</p>
                <p>متجر متخصص في بيع الملابس بأعلى جودة وأفضل الأسعار</p>
                <a href="https://wa.me/201025697415" class="whatsapp-contact" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    تواصل معنا عبر واتساب
                </a>
            </div>
        </div>
    </footer>

    <script>
        // بيانات التطبيق
        let cart = [];
        let products = [];
        let isAdminLoggedIn = false;
        let isEditing = false;
        let currentProductId = null;

        // عناصر DOM
        const productsGrid = document.getElementById('productsGrid');
        const adminPanel = document.getElementById('adminPanel');
        const toggleAdminPanel = document.getElementById('toggleAdminPanel');
        const adminForm = document.getElementById('adminForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminProductsList = document.getElementById('adminProductsList');
        const cartSidebar = document.getElementById('cartSidebar');
        const cartIcon = document.getElementById('cartIcon');
        const closeCart = document.getElementById('closeCart');
        const cartItems = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const clearCartBtn = document.getElementById('clearCartBtn');
        const overlay = document.getElementById('overlay');
        const confirmModal = document.getElementById('confirmModal');
        const cancelOrderBtn = document.getElementById('cancelOrderBtn');
        const sendWhatsAppBtn = document.getElementById('sendWhatsAppBtn');
        const orderSummary = document.getElementById('orderSummary');
        const loginModal = document.getElementById('loginModal');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const closeLogin = document.getElementById('closeLogin');

        // تهيئة التطبيق
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            loadCart();
            checkAdminLogin();
            renderProducts();
            updateCart();
        });

        // تحميل المنتجات من localStorage
        function loadProducts() {
            const savedProducts = localStorage.getItem('daStoreProducts');
            if (savedProducts) {
                products = JSON.parse(savedProducts);
            } else {
                // منتجات افتراضية
                products = [
                    {
                        id: 1,
                        name: "تيشيرت رجالي قطني",
                        description: "تيشيرت رجالي قطني عالي الجودة",
                        price: 120,
                        image_url: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                        category: "ملابس رجالية"
                    },
                    {
                        id: 2,
                        name: "جينز بنطلون",
                        description: "بنطلون جينز كلاسيكي",
                        price: 250,
                        image_url: "https://images.unsplash.com/photo-1542272604-787c3835535d?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                        category: "ملابس رجالية"
                    },
                    {
                        id: 3,
                        name: "فستان صيفي",
                        description: "فستان نسائي صيفي أنيق",
                        price: 180,
                        image_url: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                        category: "ملابس نسائية"
                    },
                    {
                        id: 4,
                        name: "جاكيت شتوي",
                        description: "جاكيت شتوي دافئ",
                        price: 350,
                        image_url: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80",
                        category: "ملابس نسائية"
                    }
                ];
                saveProducts();
            }
        }

        // حفظ المنتجات في localStorage
        function saveProducts() {
            localStorage.setItem('daStoreProducts', JSON.stringify(products));
        }

        // تحميل العربة من localStorage
        function loadCart() {
            const savedCart = localStorage.getItem('daStoreCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
        }

        // التحقق من تسجيل الدخول
        function checkAdminLogin() {
            const adminToken = localStorage.getItem('daStoreAdminToken');
            if (adminToken === 'logged_in') {
                isAdminLoggedIn = true;
                logoutBtn.style.display = 'flex';
            }
        }

        // عرض المنتجات للزبائن
        function renderProducts() {
            productsGrid.innerHTML = '';
            
            if (products.length === 0) {
                productsGrid.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-box-open"></i>
                        لا توجد منتجات حالياً
                    </div>
                `;
                return;
            }
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <img src="${product.image_url || 'https://via.placeholder.com/400x300/2c3e50/ffffff?text=D.A+Store'}" 
                         alt="${product.name}" class="product-img">
                    <div class="product-info">
                        ${product.category ? `<span class="product-category">${product.category}</span>` : ''}
                        <h3 class="product-title">${product.name}</h3>
                        ${product.description ? `<p class="product-description">${product.description}</p>` : ''}
                        <div class="product-price">${product.price} جنيه</div>
                        <div class="product-actions">
                            <div class="quantity-control">
                                <button class="quantity-btn minus-btn" data-id="${product.id}">-</button>
                                <input type="number" class="quantity-input" id="qty-${product.id}" value="1" min="1">
                                <button class="quantity-btn plus-btn" data-id="${product.id}">+</button>
                            </div>
                            <button class="add-to-cart" data-id="${product.id}">
                                <i class="fas fa-cart-plus"></i> أضف إلى العربة
                            </button>
                        </div>
                    </div>
                `;
                
                productsGrid.appendChild(productCard);
            });
            
            // إضافة مستمعي الأحداث
            attachProductEvents();
        }

        // إضافة منتج إلى العربة
        function addToCart(productId, quantity) {
            const product = products.find(p => p.id === productId);
            
            if (!product) return;
            
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    id: productId,
                    name: product.name,
                    price: product.price,
                    image: product.image_url || 'https://via.placeholder.com/400x300/2c3e50/ffffff?text=D.A+Store',
                    quantity: quantity
                });
            }
            
            updateCart();
            saveCart();
            
            // عرض عربة التسوق
            cartSidebar.classList.add('active');
            overlay.classList.add('active');
        }

        // تحديث العربة
        function updateCart() {
            cartItems.innerHTML = '';
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #888;">العربة فارغة</p>';
                cartCount.textContent = '0';
                cartTotal.textContent = '0 جنيه';
                return;
            }
            
            let total = 0;
            let totalItems = 0;
            
            cart.forEach(item => {
                total += item.price * item.quantity;
                totalItems += item.quantity;
                
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="cart-item-img">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price} جنيه</div>
                        <div class="cart-item-quantity">
                            <button class="decrease-qty" data-id="${item.id}">-</button>
                            <span>${item.quantity}</span>
                            <button class="increase-qty" data-id="${item.id}">+</button>
                        </div>
                    </div>
                    <button class="remove-item" data-id="${item.id}">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                
                cartItems.appendChild(cartItem);
            });
            
            cartCount.textContent = totalItems;
            cartTotal.textContent = `${total} جنيه`;
            
            // إضافة مستمعي الأحداث للأزرار داخل العربة
            attachCartEvents();
        }

        // حفظ العربة في localStorage
        function saveCart() {
            localStorage.setItem('daStoreCart', JSON.stringify(cart));
        }

        // إرفاق الأحداث للمنتجات
        function attachProductEvents() {
            document.querySelectorAll('.add-to-cart').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-id'));
                    const quantityInput = document.getElementById(`qty-${productId}`);
                    const quantity = parseInt(quantityInput.value);
                    addToCart(productId, quantity);
                    quantityInput.value = 1;
                });
            });
            
            document.querySelectorAll('.plus-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-id'));
                    const quantityInput = document.getElementById(`qty-${productId}`);
                    quantityInput.value = parseInt(quantityInput.value) + 1;
                });
            });
            
            document.querySelectorAll('.minus-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-id'));
                    const quantityInput = document.getElementById(`qty-${productId}`);
                    if (parseInt(quantityInput.value) > 1) {
                        quantityInput.value = parseInt(quantityInput.value) - 1;
                    }
                });
            });
        }

        // إرفاق الأحداث للعربة
        function attachCartEvents() {
            document.querySelectorAll('.remove-item').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-id'));
                    removeFromCart(productId);
                });
            });
            
            document.querySelectorAll('.increase-qty').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-id'));
                    changeQuantity(productId, 1);
                });
            });
            
            document.querySelectorAll('.decrease-qty').forEach(button => {
                button.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-id'));
                    changeQuantity(productId, -1);
                });
            });
        }

        // إزالة منتج من العربة
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
            saveCart();
        }

        // تغيير كمية المنتج
        function changeQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            
            if (!item) return;
            
            item.quantity += change;
            
            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                updateCart();
                saveCart();
            }
        }

        // تبديل لوحة التحكم
        toggleAdminPanel.addEventListener('click', function() {
            if (adminPanel.classList.contains('active')) {
                adminPanel.classList.remove('active');
                productsGrid.style.display = 'grid';
            } else {
                if (!isAdminLoggedIn) {
                    showLoginModal();
                } else {
                    adminPanel.classList.add('active');
                    productsGrid.style.display = 'none';
                    loadAdminProducts();
                }
            }
        });

        // عرض نافذة تسجيل الدخول
        function showLoginModal() {
            loginModal.classList.add('active');
            overlay.classList.add('active');
            loginError.classList.remove('active');
        }

        // تسجيل الدخول
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (username === 'asmaaali' && password === '123') {
                isAdminLoggedIn = true;
                localStorage.setItem('daStoreAdminToken', 'logged_in');
                logoutBtn.style.display = 'flex';
                loginModal.classList.remove('active');
                overlay.classList.remove('active');
                adminPanel.classList.add('active');
                productsGrid.style.display = 'none';
                loadAdminProducts();
                showAlert('تم تسجيل الدخول بنجاح', 'success');
            } else {
                loginError.classList.add('active');
            }
        });

        // إغلاق نافذة تسجيل الدخول
        closeLogin.addEventListener('click', function() {
            loginModal.classList.remove('active');
            overlay.classList.remove('active');
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', function() {
            isAdminLoggedIn = false;
            localStorage.removeItem('daStoreAdminToken');
            logoutBtn.style.display = 'none';
            adminPanel.classList.remove('active');
            productsGrid.style.display = 'grid';
            showAlert('تم تسجيل الخروج بنجاح', 'success');
        });

        // إضافة/تعديل منتج
        adminForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!isAdminLoggedIn) {
                showAlert('يجب تسجيل الدخول أولاً', 'error');
                return;
            }
            
            const productData = {
                name: document.getElementById('productName').value,
                price: parseFloat(document.getElementById('productPrice').value),
                category: document.getElementById('productCategory').value,
                image_url: document.getElementById('productImage').value,
                description: document.getElementById('productDescription').value
            };
            
            if (isEditing && currentProductId) {
                // تعديل منتج موجود
                updateProductInList(currentProductId, productData);
                showAlert('تم تحديث المنتج بنجاح', 'success');
            } else {
                // إضافة منتج جديد
                addProductToList(productData);
                showAlert('تم إضافة المنتج بنجاح', 'success');
            }
            
            resetForm();
            renderProducts();
            loadAdminProducts();
        });

        // إضافة منتج جديد
        function addProductToList(productData) {
            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            const newProduct = {
                id: newId,
                ...productData
            };
            
            products.push(newProduct);
            saveProducts();
        }

        // تحديث منتج موجود
        function updateProductInList(productId, productData) {
            const index = products.findIndex(p => p.id === productId);
            if (index !== -1) {
                products[index] = {
                    id: productId,
                    ...productData
                };
                saveProducts();
            }
        }

        // تحميل المنتجات في لوحة الإدارة
        function loadAdminProducts() {
            displayAdminProducts(products);
        }

        // عرض المنتجات في لوحة الإدارة
        function displayAdminProducts(products) {
            if (products.length === 0) {
                adminProductsList.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--gray-color);">
                        <i class="fas fa-box-open"></i>
                        <p>لا توجد منتجات حالياً</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>السعر</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            products.forEach(product => {
                html += `
                    <tr>
                        <td>
                            <img src="${product.image_url || 'https://via.placeholder.com/80x80/2c3e50/ffffff?text=D.A'}" 
                                 style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;">
                        </td>
                        <td>${product.name}</td>
                        <td>${product.price} جنيه</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-primary" onclick="editAdminProduct(${product.id})" style="padding: 5px 10px; font-size: 12px;">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-danger" onclick="deleteAdminProduct(${product.id})" style="padding: 5px 10px; font-size: 12px;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            adminProductsList.innerHTML = html;
        }

        // تعديل منتج
        window.editAdminProduct = function(productId) {
            const product = products.find(p => p.id === productId);
            
            if (product) {
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productCategory').value = product.category || 'ملابس رجالية';
                document.getElementById('productImage').value = product.image_url || '';
                document.getElementById('productDescription').value = product.description || '';
                
                isEditing = true;
                currentProductId = product.id;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';
                cancelBtn.style.display = 'flex';
            }
        };

        // حذف منتج
        window.deleteAdminProduct = function(productId) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            
            products = products.filter(p => p.id !== productId);
            saveProducts();
            showAlert('تم حذف المنتج بنجاح', 'success');
            renderProducts();
            loadAdminProducts();
        };

        // إلغاء التعديل
        cancelBtn.addEventListener('click', resetForm);

        // إعادة تعيين النموذج
        function resetForm() {
            adminForm.reset();
            document.getElementById('productId').value = '';
            document.getElementById('productCategory').value = 'ملابس رجالية';
            document.getElementById('productImage').value = 'https://via.placeholder.com/400x300/2c3e50/ffffff?text=D.A+Store';
            
            isEditing = false;
            currentProductId = null;
            submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> إضافة منتج';
            cancelBtn.style.display = 'none';
        }

        // أحداث العربة
        cartIcon.addEventListener('click', function() {
            cartSidebar.classList.add('active');
            overlay.classList.add('active');
        });

        closeCart.addEventListener('click', function() {
            cartSidebar.classList.remove('active');
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', function() {
            cartSidebar.classList.remove('active');
            overlay.classList.remove('active');
            confirmModal.classList.remove('active');
            loginModal.classList.remove('active');
        });

        // تفريغ العربة
        clearCartBtn.addEventListener('click', function() {
            if (cart.length === 0) return;
            
            if (confirm('هل تريد فعلاً تفريغ العربة؟')) {
                cart = [];
                updateCart();
                saveCart();
            }
        });

        // تأكيد الطلب
        checkoutBtn.addEventListener('click', function() {
            if (cart.length === 0) {
                showAlert('العربة فارغة، أضف منتجات أولاً', 'error');
                return;
            }
            
            cartSidebar.classList.remove('active');
            
            let summaryHTML = '';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                summaryHTML += `
                    <div class="summary-item">
                        <span>${item.name} (${item.quantity})</span>
                        <span>${itemTotal} جنيه</span>
                    </div>
                `;
            });
            
            summaryHTML += `
                <div class="summary-item" style="font-weight: bold; border-top: 1px solid #ddd; padding-top: 10px;">
                    <span>الإجمالي:</span>
                    <span>${total} جنيه</span>
                </div>
            `;
            
            orderSummary.innerHTML = summaryHTML;
            confirmModal.classList.add('active');
            overlay.classList.add('active');
        });

        // إلغاء الطلب
        cancelOrderBtn.addEventListener('click', function() {
            confirmModal.classList.remove('active');
            overlay.classList.remove('active');
        });

        // إرسال الطلب عبر واتساب
        sendWhatsAppBtn.addEventListener('click', function() {
            if (cart.length === 0) return;
            
            let message = "طلب جديد من D.A Store\n\n";
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += `- ${item.name} (الكمية: ${item.quantity}) - ${itemTotal} جنيه\n`;
            });
            
            message += `\nالإجمالي: ${total} جنيه`;
            
            const encodedMessage = encodeURIComponent(message);
            const phoneNumber = "01025697415";
            
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
            
            cart = [];
            updateCart();
            saveCart();
            
            confirmModal.classList.remove('active');
            overlay.classList.remove('active');
            
            alert('تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً.');
        });

        // عرض رسائل التنبيه
        function showAlert(message, type) {
            // إنشاء عنصر تنبيه جديد
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '80px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '1002';
            alertDiv.style.maxWidth = '400px';
            alertDiv.classList.add('show');
            
            document.body.appendChild(alertDiv);
            
            // إزالة التنبيه بعد 3 ثواني
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
